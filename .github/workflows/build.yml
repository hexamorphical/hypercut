# Builds HyperCut for Windows, Linux and macOS. Every job uploads a zip with all plugin formats
# plus the native installers for its platform (EXE / DEB+AppImage / PKG+DMG).
#
# - Every push to master and every pull request: build all three, keep the files as workflow artifacts.
# - Pushing a tag like v0.2-beta: also publish everything to that release (created and marked Latest if missing).
# - Run it by hand (Actions > build > Run workflow) with a release tag to (re)upload to an existing release.

name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Upload the builds to this release (e.g. v0.1-beta). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: read

env:
  # names the zips: the tag for releases, otherwise dev-<commit>
  VERSION: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('dev-{0}', github.sha) }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep LF line endings (shell scripts and makefiles)
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: make -f Makefile-windows -j"$(nproc)"
      - name: Package version
        shell: pwsh
        run: |
          $v = $env:VERSION -replace '^v', ''
          if ($v -match '^dev-') { $v = '0.0.0' }
          $m = [regex]::Match($v, '^\d+(\.\d+){0,2}')
          $pkg = if ($m.Success) { $m.Value } else { '0.0.0' }
          "PKG_VERSION=$pkg" >> $env:GITHUB_ENV
      - name: Package zip
        run: bash scripts/package.sh "$PKG_VERSION" windows-x64
      - name: Install Inno Setup
        # newer windows-latest images no longer ship it; skip if an older image already has it
        shell: pwsh
        run: |
          $found = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe', 'C:\Program Files\Inno Setup 6\ISCC.exe',
                     'C:\Program Files (x86)\Inno Setup 7\ISCC.exe', 'C:\Program Files\Inno Setup 7\ISCC.exe') |
                   Where-Object { Test-Path $_ }
          if (-not $found) { choco install innosetup -y --no-progress }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build EXE installer
        shell: pwsh
        run: |
          $iscc = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe', 'C:\Program Files\Inno Setup 6\ISCC.exe',
                    'C:\Program Files (x86)\Inno Setup 7\ISCC.exe', 'C:\Program Files\Inno Setup 7\ISCC.exe') |
                  Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup was not found on this runner' }
          & $iscc "/DPkgVersion=$env:PKG_VERSION" 'packaging\hypercut.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: hypercut-windows-x64
          path: |
            dist/*.zip
            dist/*.exe

  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git pkg-config freeglut3-dev \
            libgl1-mesa-dev libx11-dev libxext-dev libxcursor-dev libxrandr-dev libdbus-1-dev
      - name: Package version
        run: echo "PKG_VERSION=$(bash scripts/pkg-version.sh "$VERSION")" >> "$GITHUB_ENV"
      - name: Build (glibc 2.35 baseline) and package zip
        run: bash scripts/build-linux-release.sh "$PKG_VERSION"
      - name: Build DEB installer
        run: bash scripts/package-deb.sh "$PKG_VERSION"
      - name: Build AppImage
        run: bash scripts/package-appimage.sh "$PKG_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: hypercut-linux-x86_64
          path: |
            dist/*.zip
            dist/*.deb
            dist/*.AppImage

  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Package version
        run: echo "PKG_VERSION=$(bash scripts/pkg-version.sh "$VERSION")" >> "$GITHUB_ENV"
      - name: Build (Intel + Apple Silicon, macOS 10.15+)
        run: make macos-universal-10.15 -j"$(sysctl -n hw.ncpu)"
      - name: Ad-hoc sign
        # no Apple developer certificate: an ad-hoc signature keeps Apple Silicon happy; users still have to
        # clear the download quarantine (see the README)
        run: |
          for b in bin/HyperCut.vst3 bin/HyperCut.clap bin/HyperCut.vst bin/HyperCut.app; do
            codesign --force --deep --sign - "$b"
          done
          codesign --force --sign - bin/HyperCut.lv2/HyperCut.dylib
      - name: Package zip
        run: bash scripts/package.sh "$PKG_VERSION" macos-universal
      - name: Build PKG and DMG installers
        run: bash scripts/package-macos.sh "$PKG_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: hypercut-macos-universal
          path: |
            dist/*.zip
            dist/*.pkg
            dist/*.dmg

  release:
    name: Publish to the release
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
              --title "HyperCut $TAG" \
              --notes "Installers: Windows .exe, Linux .deb + .AppImage, macOS .pkg + .dmg. Each release also includes a .zip with every plugin format. See the README for installing."
          fi
          gh release upload "$TAG" \
            dist/*.zip dist/*.exe dist/*.deb dist/*.AppImage dist/*.pkg dist/*.dmg \
            --repo "$GITHUB_REPOSITORY" --clobber
          # checksums of every asset on the release
          mkdir -p all
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir all --clobber
          (cd all && find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "$TAG" all/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
